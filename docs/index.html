<!doctype html>
<html lang="ko" data-theme="tokyo-night" data-crt="off">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>KyongSik Yoon — Herdr Workspace Showcase</title>
    <meta
      name="description"
      content="KyongSik Yoon (sam)의 AI 개발도구·하네스·시스템 프로젝트 쇼케이스. Ghostty 터미널 안의 Herdr 워크스페이스처럼 동작하는 소개 페이지."
    />
    <meta property="og:title" content="KyongSik Yoon — Herdr Workspace Showcase" />
    <meta
      property="og:description"
      content="cc-desktop-mod, soksak, agy-cli-patch, agy-decision-lab, gemini-remote-linux, ts-gate"
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://ksyoon.com/" />
    <meta property="og:image" content="https://ksyoon.com/assets/og.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#0b0d12" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230d0f14'/%3E%3Crect x='2' y='2' width='28' height='28' rx='4' fill='none' stroke='%237aa2f7' stroke-width='1.8'/%3E%3Cpath d='M9 12l5 4-5 4M16 20h7' stroke='%237aa2f7' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round' fill='none'/%3E%3C/svg%3E"
    />
    <script>
      // Theme before first paint, so a light-mode visitor never sees a dark flash.
      (function () {
        var d = document.documentElement, theme = null, crt = null;
        try {
          theme = localStorage.getItem("herdr.theme");
          crt = localStorage.getItem("herdr.crt");
        } catch (e) {}
        if (!theme) theme = window.matchMedia("(prefers-color-scheme: light)").matches ? "paper" : "tokyo-night";
        d.setAttribute("data-theme", theme);
        d.setAttribute("data-crt", crt || (theme === "amber" || theme === "phosphor" ? "on" : "off"));
        var bar = { paper: "#fafafa", amber: "#0c0802", phosphor: "#020a05" }[theme];
        if (bar) document.querySelector('meta[name="theme-color"]').setAttribute("content", bar);
      })();
    </script>
    <!-- ?v= 는 각 파일 내용의 sha1 앞 8자다. Pages 는 모든 파일을 10분 캐시하므로, 버전이 없으면
         새 index.html 이 캐시된 옛 app.js·styles.css 와 섞여 깨진 화면이 나온다.
         css/js 를 고치면 그 파일의 ?v= 값도 함께 바꾼다. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Doto:wght@700;900&display=swap"
      rel="stylesheet"
    />
    <link rel="preload" href="./assets/fonts/JetBrainsMono-Regular.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="./hangul.css?v=280c8111" />
    <link rel="stylesheet" href="./styles.css?v=39110d1b" />
  </head>
  <body>
    <!-- ghostty 창: 뷰포트를 셀(cols × rows) 단위로 잘라 쓰고 남는 픽셀은 창 여백이 된다 -->
    <div class="ghostty" id="ghostty">
      <div class="herdr" id="app" data-layout="single" data-sidebar="drawer" data-pane="readme">
        <header class="topbar" role="banner">
          <div class="topbar-left">
            <button type="button" class="tb-btn menu-btn" id="mobile-menu-btn" aria-label="사이드바 열기" aria-expanded="false">
              <span aria-hidden="true">≡</span>
            </button>
            <button type="button" class="brand" id="brand-home-btn" title="프로필 홈으로 이동">
              <span class="brand-dot" aria-hidden="true"></span><span class="brand-name">herdr</span>
            </button>
            <span class="host-chip" title="로컬 개발 머신 및 프리픽스 바인딩">
              <span class="c-green">sam@omarchy</span><span class="c-muted"> · prefix </span><kbd>C-a</kbd>
            </span>
          </div>

          <nav class="tabs" id="topbar-tabs" aria-label="패인 탭"></nav>

          <div class="topbar-right">
            <button type="button" class="tb-btn theme-btn" id="theme-btn" title="테마 전환 (t)">
              <span aria-hidden="true">◈</span><span class="tb-label" id="theme-label">tokyo-night</span>
            </button>
            <button type="button" class="tb-btn crt-btn" id="crt-btn" title="CRT 스캔라인 효과" aria-pressed="false">
              <span class="tb-label-always">crt</span>
            </button>
            <button
              type="button"
              class="tb-btn state-btn"
              id="active-toggle-btn"
              title="에이전트 동작(working) / 대기(idle) 모션 전환"
              aria-pressed="true"
            >
              <span class="state-led" aria-hidden="true"></span><span class="tb-label" id="state-toggle-label">working</span>
            </button>
            <button type="button" class="tb-btn lang-btn" id="lang-toggle-btn" title="표시 언어 전환 (한국어 / English)">KO</button>
            <a class="tb-btn github-btn" href="https://github.com/KyongSik-Yoon" target="_blank" rel="noopener noreferrer">
              <span class="github-full">@KyongSik-Yoon</span><span class="github-short">GitHub</span><span aria-hidden="true">↗</span>
            </a>
          </div>
        </header>

        <div class="workspace">
          <div class="sidebar-backdrop" id="sidebar-backdrop" hidden></div>

          <aside class="sidebar" id="herdr-sidebar" aria-label="프로젝트 및 패인 목록">
            <div class="sb-filter">
              <label class="sr-only" for="space-filter">프로젝트 검색</label>
              <span class="c-muted" aria-hidden="true">/</span>
              <input id="space-filter" type="search" placeholder="filter spaces…" autocomplete="off" spellcheck="false" />
            </div>

            <div class="sb-scroll" id="sb-scroll">
              <div class="sb-cursor" id="sb-cursor" aria-hidden="true"></div>
              <div class="sb-head"><span>spaces</span><span class="sb-meta">home</span></div>
              <div id="profile-space-list" class="space-list"></div>
              <div class="sb-head"><span>projects</span><span class="sb-meta" id="projects-count">6/6</span></div>
              <div id="project-space-list" class="space-list" role="listbox" aria-label="프로젝트 목록"></div>
            </div>

            <div class="sb-panes">
              <div class="sb-head"><span>panes</span><span class="sb-meta" id="layout-meta">single</span></div>
              <div id="pane-list" class="pane-list"></div>
            </div>

            <div class="sb-foot">
              <div class="hints">
                <span><kbd>1</kbd>–<kbd>6</kbd> space</span>
                <span><kbd>j</kbd><kbd>k</kbd> move</span>
                <span><kbd>/</kbd> filter</span>
                <span><kbd>?</kbd> keys</span>
              </div>
              <a href="./scatter-and-bubble/scatter/index.html" class="legacy-link">legacy/scatter-and-bubble ↗</a>
            </div>
          </aside>

          <main class="main" id="herdr-main">
            <div class="tiles" id="tiles">
              <section class="pane" data-pane="readme" aria-label="README 패인">
                <div class="pane-head">
                  <div class="pane-label">
                    <span class="state-icon" id="pane-state" aria-hidden="true">●</span>
                    <b id="pane-agent-label">claude</b>
                    <span class="pane-cwd" id="pane-cwd"></span>
                    <span class="pane-branch" id="pane-branch-chip"></span>
                  </div>
                  <div class="pane-tools" id="pane-border-actions"></div>
                </div>
                <div class="pane-body" id="terminal-scroll" tabindex="0">
                  <div class="term" id="terminal-content" aria-live="polite"></div>
                </div>
                <div class="pane-foot"><span class="scroll-pos" data-scroll-pos></span></div>
              </section>

              <section class="pane" data-pane="demo" aria-label="데모 패인">
                <div class="pane-head">
                  <div class="pane-label">
                    <span class="state-icon c-yellow" aria-hidden="true">▶</span>
                    <b>demo</b>
                    <span class="pane-cwd" id="demo-title"></span>
                  </div>
                  <div class="pane-tools only-zoom">
                    <button type="button" class="pane-tool" data-zoom="demo" title="패인 확대 (z)">zoom</button>
                  </div>
                </div>
                <div class="pane-body pane-body-flex" id="demo-body" tabindex="0"></div>
                <div class="pane-foot"><span id="demo-progress"></span></div>
              </section>

              <section class="pane" data-pane="media" aria-label="미디어 패인">
                <div class="pane-head">
                  <div class="pane-label">
                    <span class="state-icon c-magenta" aria-hidden="true">■</span>
                    <b>media</b>
                    <span class="pane-cwd" id="media-title"></span>
                  </div>
                  <div class="pane-tools only-zoom">
                    <button type="button" class="pane-tool" data-zoom="media" title="패인 확대 (z)">zoom</button>
                  </div>
                </div>
                <div class="pane-body" id="media-body" tabindex="0"></div>
                <div class="pane-foot"><span class="scroll-pos" data-scroll-pos></span></div>
              </section>

              <div class="split split-x" id="split-x" role="separator" aria-orientation="vertical" title="끌어서 분할 크기 조절 · 더블클릭으로 초기화"></div>
              <div class="split split-y" id="split-y" role="separator" aria-orientation="horizontal" title="끌어서 분할 크기 조절 · 더블클릭으로 초기화"></div>
            </div>

            <div class="dock">
              <form class="prompt" id="terminal-prompt-form" autocomplete="off">
                <span class="prompt-chevron" aria-hidden="true">❯</span>
                <label class="sr-only" for="terminal-cmd-input">터미널 명령 입력</label>
                <input
                  id="terminal-cmd-input"
                  type="text"
                  placeholder="help · ls · open soksak · theme amber"
                  spellcheck="false"
                  autocapitalize="off"
                  autocorrect="off"
                  enterkeyhint="go"
                />
                <span class="prompt-hint" id="prompt-feedback" aria-live="polite"></span>
              </form>
              <footer class="statusline" id="statusline-dock" aria-label="터미널 상태줄">
                <div class="sl-logo" id="statusline-logo-slot"></div>
                <div class="sl-rows" id="statusline-rows"></div>
              </footer>
            </div>
          </main>
        </div>
      </div>
    </div>

    <div class="resize-overlay" id="resize-overlay" aria-hidden="true"></div>
    <div class="toasts" id="toasts" aria-live="polite"></div>
    <div class="whichkey" id="whichkey" hidden></div>

    <div class="lightbox" id="lightbox" hidden role="dialog" aria-modal="true" aria-label="미디어 크게 보기">
      <div class="lb-bar">
        <span class="lb-title" id="lb-title"></span>
        <span class="lb-actions">
          <a class="pane-tool" id="lb-open" target="_blank" rel="noopener noreferrer" hidden>open ↗</a>
          <button type="button" class="pane-tool" id="lb-prev" aria-label="이전">← prev</button>
          <button type="button" class="pane-tool" id="lb-next" aria-label="다음">next →</button>
          <button type="button" class="pane-tool" id="lb-close" aria-label="닫기">esc ✕</button>
        </span>
      </div>
      <div class="lb-stage" id="lb-stage"></div>
      <div class="lb-caption" id="lb-caption"></div>
    </div>

    <div class="boot" id="boot" hidden aria-hidden="true"><pre id="boot-lines"></pre></div>
    <div class="crt-layer" aria-hidden="true"><i class="crt-roll"></i></div>
    <span class="cell-probe" id="cell-probe" aria-hidden="true">0000000000</span>

    <noscript>
      <div class="noscript">

          <li><a href="https://github.com/KyongSik-Yoon/agy-cli-patch">agy-cli-patch</a></li>
          <li><a href="https://github.com/KyongSik-Yoon/agy-decision-lab">agy-decision-lab</a></li>
          <li><a href="https://github.com/KyongSik-Yoon/gemini-remote-linux">gemini-remote-linux</a></li>
          <li><a href="https://github.com/KyongSik-Yoon/ts-gate">ts-gate</a></li>
        </ul>
      </div>
    </noscript>

    <script src="./data.js?v=724bf9a5" defer></script>
    <script src="./captures.js?v=e0490ad7" defer></script>
    <script src="./app.js?v=8ee18d5f" defer></script>
  </body>
</html>
